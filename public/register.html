<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | TourismPro</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="logo">TourismPro</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="tours.html">Tours</a>
            <a href="services.html">Services</a>
            <a href="about.html">About</a>
            <div id="auth-links" style="display: inline-block;">
                <a href="login.html">Login</a>
            </div>
            <div id="user-links" style="display: none;">
                <a href="#" id="dashboard-link" class="btn btn-primary"
                    style="padding: 0.5rem 1rem; border-radius: 5px; color: white; text-decoration: none;">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <h2 style="margin-bottom: 0.5rem; text-align: center;">Create Your Account</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem;">
                Join our community of travelers and guides
            </p>

            <div id="error-alert" class="error-message"></div>
            <div id="success-alert" class="success-message"></div>

            <form id="register-form">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" required placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="you@example.com">
                </div>

                <div class="form-group password-toggle">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                    <button type="button" class="toggle-password" onclick="togglePassword('password')">
                        👁️
                    </button>
                </div>

                <div class="form-group password-toggle">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" required placeholder="••••••••">
                    <button type="button" class="toggle-password" onclick="togglePassword('confirm-password')">
                        👁️
                    </button>
                </div>

                <div class="form-group">
                    <label>I want to join as:</label>
                    <div class="role-group">
                        <div class="role-option">
                            <input type="radio" id="customer" name="role" value="customer" checked>
                            <label for="customer">👤 Customer</label>
                        </div>
                        <div class="role-option">
                            <input type="radio" id="manager" name="role" value="manager">
                            <label for="manager">👨‍ch Manager</label>
                        </div>
                    </div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">
                        I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Create Account
                </button>
            </form>

            <p class="form-link">
                Already have an account? <a href="login.html">Sign in</a>
            </p>
        </div>
    </div>

    <script src="js/register.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
