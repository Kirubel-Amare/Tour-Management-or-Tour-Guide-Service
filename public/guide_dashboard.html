<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guide Dashboard | TourismPro</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="logo">TourismPro <span
                style="font-size: 0.8rem; background: var(--secondary); padding: 2px 6px; border-radius: 4px; vertical-align: middle;">GUIDE</span></a>
        <div class="nav-links">
            <span id="welcome-msg" style="color: var(--text-muted); margin-right: 1rem;"></span>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </nav>

    <div
        style="max-width: 1200px; margin: 2rem auto; padding: 0 1rem; display: grid; grid-template-columns: 1fr 2fr; gap: 2rem;">

        <!-- Create Tour Column -->
        <div>
            <div class="auth-card" style="max-width: 100%;">
                <h3 style="margin-bottom: 1.5rem;">Create New Tour</h3>
                <form id="create-tour-form">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="title" required>
                    </div>
                    <div class="form-group">
                        <label>Location</label>
                        <select id="location" required>
                            <option value="">Select a Place...</option>
                            <!-- Populated via API -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Price ($)</label>
                        <input type="number" id="price" required step="0.01">
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="date" required>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <input type="text" id="desc" required
                            style="width: 100%; padding: 0.75rem; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--glass-border); border-radius: 0.5rem; color: white;">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Publish Tour</button>
                </form>
            </div>
        </div>

        <!-- My Tours Column -->
        <div>
            <h2 style="margin-bottom: 1.5rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 0.5rem;">My
                Active Tours</h2>
            <div id="tours-list">
                <p style="color: var(--text-muted);">Loading tours...</p>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script>
        // Init
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || user.role !== 'guide') window.location.href = 'login.html';

        document.getElementById('welcome-msg').textContent = `Hello, ${user.name}`;

        // Load Places for Dropdown
        async function loadPlaces() {
            try {
                const res = await fetch('/api/places/read.php');
                const places = await res.json();
                const select = document.getElementById('location');
                places.forEach(p => {
                    const option = document.createElement('option');
                    option.value = `${p.city}, ${p.country}`;
                    option.textContent = `${p.name} (${p.city})`;
                    select.appendChild(option);
                });
            } catch (e) { console.error('Error loading places', e); }
        }

        // Load Tours
        async function loadTours() {
            try {
                const res = await fetch('/api/tours/read.php');
                const tours = await res.json();
                const container = document.getElementById('tours-list');
                const myTours = tours.filter(t => t.guide_id == user.id);

                if (myTours.length === 0) {
                    container.innerHTML = '<p style="color: var(--text-muted);">No tours created yet.</p>';
                } else {
                    container.innerHTML = myTours.map(t => createTourCard(t, true)).join('');
                }
            } catch (e) {
                console.error('Error loading tours', e);
            }
        }

        // Create Tour Handler
        document.getElementById('create-tour-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const tourData = {
                guide_id: user.id,
                title: document.getElementById('title').value,
                location: document.getElementById('location').value,
                price: document.getElementById('price').value,
                schedule_date: document.getElementById('date').value,
                description: document.getElementById('desc').value,
            };

            const res = await fetch('/api/tours/create.php', {
                method: 'POST',
                body: JSON.stringify(tourData)
            });

            if (res.ok) {
                alert('Tour Created Successfully!');
                loadTours();
                e.target.reset(); // Clear form
            } else {
                alert('Failed to create tour.');
            }
        });

        // Delete Tour Handler
        async function deleteTour(id) {
            if (!confirm('Are you sure you want to delete this tour?')) return;

            const res = await fetch('/api/tours/delete.php', {
                method: 'DELETE',
                body: JSON.stringify({ id: id, guide_id: user.id })
            });

            if (res.ok) {
                loadTours();
            } else {
                alert('Failed to delete tour.');
            }
        }

        async function logout() {
            await fetch('/api/auth/logout.php', { method: 'POST' });
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }

        loadPlaces();
        loadTours();
    </script>
</body>

</html>
