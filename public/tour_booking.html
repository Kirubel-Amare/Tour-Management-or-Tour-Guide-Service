<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Booking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/service.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <section class="service-section active booking-section">
        <div class="service-container">
            <div class="service-header">
                <h2>Tour Details & Booking</h2>
                <p>Review the tour info, set your group size, and submit a request for approval.</p>
            </div>

            <div class="booking-grid">
                <div class="booking-card" id="tour-summary">
                    <div class="image-wrapper">
                        <img id="tour-image" alt="Tour" />
                    </div>
                    <div class="booking-details">
                        <h3 id="tour-title"></h3>
                        <p class="location"><i class="fas fa-map-marker-alt"></i> <span id="tour-location"></span></p>
                        <p class="price"><i class="fas fa-dollar-sign"></i> <span id="tour-price"></span></p>
                        <p class="duration"><i class="fas fa-clock"></i> <span id="tour-duration"></span></p>
                        <p class="schedule"><i class="fas fa-calendar"></i> <span id="tour-schedule"></span></p>
                    </div>
                </div>

                <div class="booking-card">
                    <h3>Booking Details</h3>
                    <form id="booking-form">
                        <div class="form-group">
                            <label for="people">Number of People</label>
                            <input type="number" id="people" name="people" min="1" value="1" required>
                        </div>

                        <div class="form-group">
                            <label for="date">Preferred Date</label>
                            <input type="date" id="date" name="date" required>
                        </div>

                        <div class="form-group">
                            <label for="notes">Special Requests</label>
                            <textarea id="notes" name="notes" rows="3" placeholder="Add any notes for the tour operator"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-paper-plane"></i> Submit Booking Request
                        </button>
                    </form>
                    <p class="helper">Bookings are reviewed by our team. You will receive a confirmation once approved.</p>
                </div>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <div id="messageModal" class="message-modal">
        <div class="message-content">
            <div class="message-header">
                <span id="messageTitle">Notification</span>
                <button id="messageCloseBtn" class="message-close">&times;</button>
            </div>
            <div id="messageBody" class="message-body"></div>
            <div class="message-actions">
                <button id="messageOkBtn" class="btn btn-primary">OK</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/tour_booking.js"></script>
</body>
</html>
