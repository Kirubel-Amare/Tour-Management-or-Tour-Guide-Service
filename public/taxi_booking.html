<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Taxi | TourismPro</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/service.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="page-section" style="padding: 3rem 1rem; background: #f9fafb;">
        <div class="container" style="max-width: 1100px; margin: 0 auto; display: grid; gap: 2rem; grid-template-columns: 3fr 2fr; align-items: start;">
            <section class="taxi-booking-form" id="taxi-booking-card">
                <div class="booking-intro">
                    <span class="booking-icon"><i class="fas fa-taxi"></i></span>
                    <h3>Book This Taxi</h3>
                    <p>Only pickup, destination, and pickup time are required. Other details are auto-filled from the selected car.</p>
                </div>
                <form id="taxi-booking-form" class="booking-form" onsubmit="orderSelectedTaxi(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="pickup-location">Pickup Location</label>
                            <input type="text" id="pickup-location" name="pickup" placeholder="e.g., Airport Terminal 1" required>
                        </div>
                        <div class="form-group">
                            <label for="destination">Destination</label>
                            <input type="text" id="destination" name="destination" placeholder="e.g., Downtown Hotel" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="pickup-time">Pickup Time</label>
                            <input type="datetime-local" id="pickup-time" name="pickup_time" required>
                        </div>
                    </div>

                    <!-- Hidden fields populated from selected taxi -->
                    <input type="hidden" id="selected-taxi-id">
                    <input type="hidden" id="selected-taxi-name">
                    <input type="hidden" id="selected-taxi-vehicle">

                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-check-circle"></i> Confirm Booking
                    </button>
                </form>
            </section>

            <aside class="taxi-summary">
                <div class="taxi-summary-card">
                    <div class="summary-hero" id="summary-hero">
                        <div class="summary-hero-icon"><i class="fas fa-car-side"></i></div>
                        <div class="summary-hero-copy">
                            <p class="summary-label">Selected Car</p>
                            <h4 id="summary-name">Not selected</h4>
                            <p id="summary-vehicle" class="summary-sub">Vehicle type</p>
                        </div>
                    </div>
                    <div class="summary-body">
                        <div class="summary-row">
                            <span>Service ID</span>
                            <strong id="summary-id">—</strong>
                        </div>
                        <div class="summary-row">
                            <span>Pickup</span>
                            <strong id="summary-pickup">—</strong>
                        </div>
                        <div class="summary-row">
                            <span>Destination</span>
                            <strong id="summary-destination">—</strong>
                        </div>
                        <div class="summary-row">
                            <span>Pickup Time</span>
                            <strong id="summary-time">—</strong>
                        </div>
                        <div class="summary-chips" id="summary-extra"></div>
                    </div>
                    <div class="summary-footer">
                        <p class="summary-note">Pricing, seats, and ETA come directly from the taxi you picked.</p>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <!-- Reusable Message Box Modal -->
    <div id="message-modal" class="msg-modal" aria-hidden="true">
        <div class="msg-backdrop" data-close="true"></div>
        <div class="msg-dialog info" role="dialog" aria-modal="true" aria-labelledby="msg-title">
            <div class="msg-header">
                <span id="msg-title">Message</span>
                <button type="button" class="msg-close" aria-label="Close" data-close="true">&times;</button>
            </div>
            <div class="msg-body" id="msg-body"></div>
            <div class="msg-actions">
                <button type="button" class="btn btn-primary" id="msg-ok">OK</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/taxi_booking.js"></script>
</body>
</html>
